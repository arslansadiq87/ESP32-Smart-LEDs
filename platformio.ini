[env:featheresp32]
platform = espressif32@6.8.0
board = featheresp32
framework = arduino
monitor_speed = 115200

; Use LittleFS for the modern dashboard UI
board_build.filesystem = littlefs

lib_deps =
  fastled/FastLED@3.6.0
  bblanchon/ArduinoJson@^7
build_flags =
  -DFASTLED_INTERNAL
  -Os
  -DARDUINO_JSON_DOCUMENT_SIZE=1024
  -DARDUINO_JSON_ARRAY_SIZE=64
  -DARDUINO_JSON_OBJECT_SIZE=32

; Remote upload uses the firmware HTTP updater at http://rgb.local/update
upload_protocol = custom
upload_port = http://rgb.local/update
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/http_ota_upload.py" "$SOURCE" "$UPLOAD_PORT" "60"
