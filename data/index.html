<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB Controller – Main Hub</title><style>:root{--bg0:#07090e;--bg1:#0b1020;--stroke:rgba(255,255,255,.08);--text:#e8ecf8;--mut:#9aa6b7;--good:#29f2a6;--info:#4cc3ff;--bad:#ff4d6d;--glow:0 0 18px rgba(76,195,255,.25);--radius:18px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:radial-gradient(1200px 700px at 18% 10%,#122458 0%,transparent 55%),radial-gradient(1000px 500px at 80% 20%,#0f4b36 0%,transparent 55%),radial-gradient(900px 600px at 50% 90%,#2b124a 0%,transparent 55%),linear-gradient(180deg,var(--bg0),var(--bg1));overflow-x:hidden}.bg{position:fixed;inset:0;background:radial-gradient(600px 300px at 22% 30%,rgba(76,195,255,.10),transparent 60%),radial-gradient(520px 260px at 75% 35%,rgba(41,242,166,.10),transparent 60%);pointer-events:none}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(5,8,14,.40);backdrop-filter:blur(14px)}.title .brand{font-size:18px;font-weight:750;letter-spacing:.3px}.title .subtitle{margin-top:2px;font-size:12px;color:var(--mut)}.status{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;white-space:nowrap}.status .pill{flex:0 0 auto}#tbTime{max-width:220px;overflow:hidden;text-overflow:ellipsis}.chip{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid rgba(255,255,255,.09);background:rgba(20,26,38,.40);border-radius:999px}.dot{width:10px;height:10px;border-radius:999px;background:var(--bad);box-shadow:var(--glow)}.dot.ok{background:var(--good)}.wrap{max-width:1400px;margin:0 auto;padding:28px 28px 18px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin:16px 0 18px}.hero-left,.hero-right{border:1px solid var(--stroke);background:linear-gradient(180deg,rgba(20,26,38,.62),rgba(20,26,38,.34));border-radius:var(--radius);box-shadow:0 18px 60px rgba(0,0,0,.35);backdrop-filter:blur(16px);overflow:hidden}.hero-left{padding:18px;display:flex;align-items:center;gap:18px}.hero-right{display:grid;grid-template-rows:repeat(3,1fr)}.hero-icon{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,rgba(76,195,255,.20),rgba(41,242,166,.12));border:1px solid rgba(255,255,255,.10);box-shadow:var(--glow);display:flex;align-items:center;justify-content:center;flex:0 0 auto}.hero-icon svg{filter:drop-shadow(0 0 12px rgba(76,195,255,.28))}.stroke{stroke:rgba(255,255,255,0.85);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hero-icon .stroke{stroke:rgba(76,195,255,0.95);filter:drop-shadow(0 0 10px rgba(76,195,255,0.35))}.hero-kicker{font-size:13px;color:rgba(255,255,255,.70);margin-bottom:4px}.hero-title{font-size:24px;font-weight:850;letter-spacing:.2px;margin-bottom:6px}.hero-sub{font-size:13px;color:rgba(255,255,255,.75);line-height:1.35;max-width:520px}.stat{padding:16px 18px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid rgba(255,255,255,.06)}.stat:last-child{border-bottom:none}.stat-label{font-size:12px;color:rgba(255,255,255,.60)}.stat-value{margin-top:6px;font-size:22px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;padding:12px 12px 24px}.card{grid-column:span 6;border:1px solid var(--stroke);background:linear-gradient(180deg,rgba(20,26,38,.62),rgba(20,26,38,.30));border-radius:var(--radius);backdrop-filter:blur(18px);box-shadow:0 16px 50px rgba(0,0,0,.32);overflow:hidden;position:relative;padding:18px}.card::after{content:"";position:absolute;inset:-2px;background:radial-gradient(600px 180px at 20% 0%,rgba(76,195,255,.12),transparent 60%);pointer-events:none}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.card-title{display:flex;align-items:center;gap:10px}.badge{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);box-shadow:var(--glow)}.badge svg{opacity:.95;display:block}.card-name{font-weight:800;letter-spacing:.2px}.card-meta{margin-top:2px;font-size:12px;color:var(--mut)}.card-actions{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;white-space:nowrap}.card-body{padding-top:14px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.kv-item{display:flex;flex-direction:column}.kv-row{display:flex;align-items:center;gap:10px}.kv-label{font-size:12px;color:rgba(255,255,255,.65);margin-bottom:6px}input[type=color]{width:46px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.12);padding:0;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:6px}input[type=color]::-webkit-color-swatch{border:none;border-radius:8px}input[type=range]{width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.18);outline:0;appearance:none;accent-color:var(--info)}input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:rgba(41,242,166,.95);box-shadow:0 0 0 4px rgba(41,242,166,.15),0 8px 18px rgba(0,0,0,.35);cursor:pointer}input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:0;background:rgba(41,242,166,.95);box-shadow:0 0 0 4px rgba(41,242,166,.15),0 8px 18px rgba(0,0,0,.35);cursor:pointer}input[type=number]{width:92px;height:38px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(10,16,24,.55);color:rgba(255,255,255,.92);outline:0;appearance:textfield}select{width:100%;height:42px;padding:0 42px 0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(10,16,24,.55);color:rgba(255,255,255,.92);outline:0;appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer}select:hover{border-color:rgba(41,242,166,.35)}select:focus{border-color:rgba(41,242,166,.65);box-shadow:0 0 0 3px rgba(41,242,166,.15)}select option{background:#0b1220;color:rgba(255,255,255,.92)}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:linear-gradient(135deg,rgba(76,195,255,.85),rgba(41,242,166,.75));color:#06101a;font-weight:800;padding:11px 14px;border-radius:14px;cursor:pointer;box-shadow:var(--glow)}.btn.ghost{background:0;border:1px solid rgba(255,255,255,.12);color:var(--text);box-shadow:none}.btn:active{transform:translateY(1px)}.btn.small{font-size:12px}.row{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:12px;margin-top:12px}.row .label{font-weight:650;color:rgba(255,255,255,.85);white-space:nowrap}.row input[type=range]{width:100%}.slider-pill{min-width:74px;justify-content:center;text-align:center}.footer{margin-top:16px;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.allzones{grid-column:1 / -1}#dot-net{width:10px;height:10px;border-radius:999px;display:inline-block}@media (max-width:980px){.hero{grid-template-columns:1fr}.card{grid-column:span 12}.hero-left{align-items:flex-start}.hero-left,.hero-right{min-height:auto}}@media (max-width:720px){.status{flex-wrap:wrap}}@media (max-width:520px){.row{grid-template-columns:1fr}.slider-pill{justify-content:flex-start;min-width:auto}}</style></head><body><div class="bg"></div><header class="topbar"><div class="title"><div class="brand">RGB Controller</div><div class="subtitle">Main Hub</div></div><div class="status"><div class="pill"><span class="dot" id="dot-net"></span><span id="tbStatus">Offline</span></div><div class="pill mono" id="tbIP">—</div><div class="pill mono" id="tbTime">—</div></div></header><main class="wrap"><section class="hero card"><div id="heroAccent" style="display:none"></div><div class="hero-left"><div id="heroOrb" style="display:none"></div><div class="hero-icon"><svg viewBox="0 0 64 64" fill="none"><path d="M40.8 28.2c.8-5.7-3.6-10.7-9.4-10.7-4.6 0-8.6 3.2-9.5 7.7-5.5.3-9.9 4.8-9.9 10.4 0 5.9 4.8 10.6 10.6 10.6H40c6.3 0 11.4-5.1 11.4-11.4 0-6-4.6-10.9-10.6-11.6Z" class="stroke"/><path d="M24 51l-3 8m15-8-3 8m15-8-3 8" class="stroke"/></svg></div><div><div class="hero-kicker" id="heroTitle">Live Scene</div><div class="hero-title" id="heroSub">All Zones</div><div class="hero-sub" id="heroDesc">Tap a zone to control it. Changes apply instantly.</div></div></div><div class="hero-right"><div class="stat"><div class="stat-label">Active Zones</div><div class="stat-value" id="statZones">—</div></div><div class="stat"><div class="stat-label">Current Pattern</div><div class="stat-value" id="statPattern">—</div></div><div class="stat"><div class="stat-label">Brightness</div><div class="stat-value" id="statBrightness">—</div></div></div></section><section class="grid" id="grid"></section><footer class="footer"><button class="btn ghost" id="btn-refresh">Refresh</button><button class="btn ghost" id="btn-hk-reset">Reset HomeKit Pairing</button><button class="btn" id="btn-save">Save to Device</button></footer></main><script src="/assets/app.js"></script></body></html>
